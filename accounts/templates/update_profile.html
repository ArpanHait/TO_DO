<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile - TO_DO</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=3">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=3">
    <link rel="apple-touch-icon" href="/static/favicon.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .update-container {
            background: var(--container-bg, rgba(15, 23, 42, 0.85));
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid var(--container-border, rgba(255, 255, 255, 0.08));
            box-shadow: var(--container-shadow, 0 20px 40px -15px rgba(0, 0, 0, 0.6));
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .update-container h2 {
            color: var(--text-primary, #f8fafc);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-top: 0;
            margin-bottom: 24px;
        }

        /* Avatar Container & Live Preview */
        .avatar-preview-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
        }

        .current-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2563eb;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
        }

        .avatar-initial-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            font-size: 3.2rem;
            font-weight: 800;
            border: 3px solid #2563eb;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.35);
        }

        .preview-badge {
            position: absolute;
            bottom: -4px;
            right: 4px;
            background: #10b981;
            color: white;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 999px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .update-container form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .file-input-wrapper {
            position: relative;
            text-align: left;
        }

        .file-input-label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-secondary, #94a3b8);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .update-container input[type="file"] {
            padding: 12px;
            border: 1px solid var(--input-border, rgba(255, 255, 255, 0.12));
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            background-color: var(--input-bg, rgba(11, 15, 25, 0.6));
            color: var(--text-primary, #f8fafc);
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
        }

        .update-container input[type="file"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
            outline: none;
        }

        /* Animated Upload Progress Bar */
        .upload-progress-wrapper {
            margin: 4px 0;
            text-align: left;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #10b981);
            border-radius: 999px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .upload-status-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-secondary, #94a3b8);
            margin-top: 6px;
            font-weight: 600;
        }

        .update-container button[type="submit"] {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .update-container button[type="submit"]:hover:not(:disabled) {
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .update-container button[type="submit"]:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none;
        }

        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .update-container a.cancel-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary, #94a3b8);
            border: 1px solid var(--container-border, rgba(255, 255, 255, 0.08));
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .update-container a.cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    </style>
</head>
<body>
    {% include 'auth_theme_particles.html' %}
    
    <!-- Top-Middle Pulse LED Backend Status -->
    <div class="server-status-wrapper">
        <div id="serverStatusBadge" class="server-status-badge status-checking" title="Live status of your backend server & database">
            <span class="pulse-dot"></span>
            <span id="serverStatusText" class="status-text">Connecting to Server...</span>
            <span id="serverPingTime" class="ping-text"></span>
        </div>
    </div>

    <div class="update-container themed-container">
        <h2>Update Profile Photo</h2>
        
        <!-- Live Avatar Preview Circle -->
        <div class="avatar-preview-wrapper" id="avatarPreviewWrapper">
            {% if user.profile.image %}
                <img id="avatarImg" src="{{ user.profile.image.url }}" alt="Current Photo" class="current-photo" onerror="this.style.display='none'; document.getElementById('avatarFallback').style.display='flex';">
                <div id="avatarFallback" class="avatar-initial-fallback" style="display: none;">
                    {{ user.username|make_list|first|upper }}
                </div>
            {% else %}
                <img id="avatarImg" src="" alt="Photo Preview" class="current-photo" style="display: none;">
                <div id="avatarFallback" class="avatar-initial-fallback">
                    {{ user.username|make_list|first|upper }}
                </div>
            {% endif %}
            <span id="newPreviewBadge" class="preview-badge" style="display: none;">New Preview</span>
        </div>
        
        <form id="profileUploadForm" action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="file-input-wrapper">
                <label for="imageInput" class="file-input-label">Select a new image from your device</label>
                <input type="file" id="imageInput" name="image" accept="image/*" title="Choose a new profile photo" aria-label="Choose a new profile photo" required>
            </div>

            <!-- Upload Progress Bar (shown on submit) -->
            <div id="uploadProgressWrapper" class="upload-progress-wrapper" style="display: none;">
                <div class="progress-track">
                    <div id="progressFillBar" class="progress-fill-bar"></div>
                </div>
                <div class="upload-status-text">
                    <span id="uploadStatusLabel">Compressing & Uploading...</span>
                    <span id="uploadPercentLabel">0%</span>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="material-symbols-outlined" style="font-size: 20px;">cloud_upload</span>
                <span>Upload Photo</span>
            </button>
            <a href="{% url 'dashboard' %}" class="cancel-btn">Cancel</a>
        </form>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const avatarImg = document.getElementById('avatarImg');
        const avatarFallback = document.getElementById('avatarFallback');
        const newPreviewBadge = document.getElementById('newPreviewBadge');
        const form = document.getElementById('profileUploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const progressWrapper = document.getElementById('uploadProgressWrapper');
        const progressFill = document.getElementById('progressFillBar');
        const percentLabel = document.getElementById('uploadPercentLabel');
        const statusLabel = document.getElementById('uploadStatusLabel');

        // Instant Live Preview on image selection
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                avatarImg.src = objectUrl;
                avatarImg.style.display = 'block';
                if (avatarFallback) avatarFallback.style.display = 'none';
                newPreviewBadge.style.display = 'inline-block';
            }
        });

        // Fast Client-Side Image Compression using Canvas (reduces MBs to ~100KB in 50ms)
        async function compressImageFile(file, maxDimension = 500, quality = 0.85) {
            return new Promise((resolve) => {
                // If it's already tiny (< 250KB), no need to re-encode
                if (file.size < 250 * 1024) {
                    resolve(file);
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        if (!blob) {
                            resolve(file);
                            return;
                        }
                        const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                            type: 'image/jpeg',
                            lastModified: Date.now()
                        });
                        resolve(compressedFile);
                    }, 'image/jpeg', quality);
                };
                img.onerror = () => resolve(file);
                img.src = URL.createObjectURL(file);
            });
        }

        // Form Submit Handler with Compression and Animated Progress Bar
        form.addEventListener('submit', async function(e) {
            const file = imageInput.files[0];
            if (!file) return;

            e.preventDefault();

            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-spinner"></span> <span>Uploading Photo...</span>';
            progressWrapper.style.display = 'block';
            progressFill.style.width = '25%';
            percentLabel.textContent = '25%';
            statusLabel.textContent = 'Optimizing photo...';

            try {
                // Fast auto-compression
                const compressedFile = await compressImageFile(file);

                progressFill.style.width = '65%';
                percentLabel.textContent = '65%';
                statusLabel.textContent = 'Uploading to server...';

                // Assign compressed file to the input via DataTransfer
                const dt = new DataTransfer();
                dt.items.add(compressedFile);
                imageInput.files = dt.files;

                progressFill.style.width = '90%';
                percentLabel.textContent = '90%';

                // Submit form normally
                form.submit();
            } catch (err) {
                console.error('Compression/Upload error:', err);
                form.submit();
            }
        });
    </script>
</body>
</html>
