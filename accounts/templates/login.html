<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TO_DO</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=3">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=3">
    <link rel="apple-touch-icon" href="/static/favicon.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif !important;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            
            /* Aesthetic Mesh Grid Background */
            background-color: #0b0f19;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            position: relative;
        }

        .login-container {
            background-color: rgba(20, 25, 40, 0.85);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            will-change: transform;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }
        .login-container h2 {
            text-align: center;
            color: #f8fafc;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }
        .login-container form {
            display: flex;
            flex-direction: column;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.3);
            color: #f8fafc;
            transition: all 0.3s ease;
        }
        .login-container input[type="text"]:focus,
        .login-container input[type="password"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.35);
            outline: none;
        }
        .login-container input[type="submit"] {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        .login-container input[type="submit"]:hover {
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.5);
            transform: translateY(-1px);
        }
        .login-container p {
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
            font-size: 14px;
        }
        .login-container a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: bold;
            transition: text-shadow 0.3s ease;
        }
        .login-container a:hover {
            text-decoration: none;
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }
        .login-container .skip-link {
            margin-top: 24px;
            margin-bottom: -10px;
        }
        /* Message Styles */
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid transparent;
            border-radius: 6px;
            text-align: center;
            font-size: 0.95rem;
        }
        .alert-success {
            color: #34d399;
            background-color: rgba(52, 211, 153, 0.1);
            border-color: rgba(52, 211, 153, 0.2);
        }
        .alert-error {
            color: #fb7185;
            background-color: rgba(251, 113, 133, 0.1);
            border-color: rgba(251, 113, 133, 0.2);
        }
    </style>
</head>
<body>
    {% include 'auth_theme_particles.html' %}
    
    <!-- Top-Middle Pulse LED Backend Status -->
    <div class="server-status-wrapper">
        <div id="serverStatusBadge" class="server-status-badge status-checking" title="Live status of your backend server & database">
            <span class="pulse-dot"></span>
            <span id="serverStatusText" class="status-text">Connecting...</span>
            <span id="serverPingTime" class="ping-text"></span>
        </div>
    </div>

    <div class="login-container themed-container">
        <h2>Welcome Back</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <form action="" method="post">
            {% csrf_token %}
            <input type="text" name="uname" placeholder="Username" required autocomplete="username">
            <div class="password-wrapper">
                <input type="password" id="loginPassword" name="pwd" placeholder="Password" required autocomplete="current-password">
                <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Show password" aria-label="Toggle password visibility">
                    <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg class="eye-icon eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>
            <input type="submit" value="Login">
        </form>
        <p class="skip-link"><a href="{% url 'home' %}">Skip for now &rarr;</a></p>
        <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
    </div>
</body>
</html>
