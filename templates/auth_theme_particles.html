<!-- Day/Night Mode & Connected Particles Module with Server Health Pulse LED -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

<style>
/* Global CSS Variables for Day/Night Theme */
:root {
    --bg-main: #0b0f19;
    --grid-line: rgba(0, 255, 255, 0.08);
    --glow-center: rgba(255, 0, 255, 0.15);
    
    --container-bg: rgba(15, 23, 42, 0.85);
    --container-border: rgba(255, 255, 255, 0.08);
    --container-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
    
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    
    --input-bg: rgba(11, 15, 25, 0.6);
    --input-border: rgba(255, 255, 255, 0.12);
    
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.35);
    --btn-grad-start: #2563eb;
    --btn-grad-end: #4f46e5;
}

body.light-mode {
    --bg-main: #f0f4f8;
    --grid-line: rgba(0, 0, 0, 0.04);
    --glow-center: rgba(0, 0, 255, 0.05);
    
    --container-bg: rgba(255, 255, 255, 0.9);
    --container-border: rgba(226, 232, 240, 0.9);
    --container-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
    
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    
    --input-bg: #ffffff;
    --input-border: #cbd5e1;
    
    --accent: #2563eb;
    --accent-glow: rgba(37, 99, 235, 0.2);
    --btn-grad-start: #2563eb;
    --btn-grad-end: #3b82f6;
}

body {
    background-color: var(--bg-main);
    background-image: 
        radial-gradient(circle at center, var(--glow-center), transparent 60%),
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 100% 100%, 30px 30px, 30px 30px;
    background-position: center;
    background-attachment: fixed;
    color: var(--text-primary);
    transition: background-color 0.4s ease, color 0.4s ease;
    animation: fadeIn 0.4s ease-out forwards;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes fadeOut {
    from { opacity: 1; }
    to { opacity: 0; }
}

/* Base override for containers to inherit theme easily */
.themed-container {
    background: var(--container-bg) !important;
    border: 1px solid var(--container-border) !important;
    box-shadow: var(--container-shadow) !important;
    color: var(--text-primary) !important;
}
.themed-container h2 { color: var(--text-primary) !important; }
.themed-container p { color: var(--text-secondary) !important; }
.themed-container input[type="text"], 
.themed-container input[type="password"],
.themed-container input[type="email"],
.themed-container input[type="file"] {
    background-color: var(--input-bg) !important;
    border-color: var(--input-border) !important;
    color: var(--text-primary) !important;
}
.themed-container input:focus {
    border-color: var(--accent) !important;
    box-shadow: 0 0 8px var(--accent-glow) !important;
}
.themed-container input[type="submit"],
.themed-container button[type="submit"] {
    background: linear-gradient(135deg, var(--btn-grad-start), var(--btn-grad-end)) !important;
}
.themed-container a { color: var(--accent) !important; }

/* Particles Canvas wrapper */
#tsparticles {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
}

/* Floating Day/Night switch */
.theme-switch-wrapper {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}
#theme-toggle-btn {
    background: var(--container-bg);
    border: 1px solid var(--container-border);
    color: var(--text-primary);
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    cursor: pointer;
    box-shadow: var(--container-shadow);
    transition: all 0.3s ease;
}
#theme-toggle-btn:hover {
    transform: scale(1.1);
}

/* Server Health Pulse LED Badge */
.server-status-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 16px;
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 10;
}

.server-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 16px;
    border-radius: 9999px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: default;
    user-select: none;
}

.pulse-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
    position: relative;
    flex-shrink: 0;
}

/* Online State (Green) */
.server-status-badge.status-online {
    background: rgba(16, 185, 129, 0.14);
    border: 1px solid rgba(16, 185, 129, 0.45);
    color: #10b981;
}
.server-status-badge.status-online .pulse-dot {
    background-color: #10b981;
    box-shadow: 0 0 10px #10b981, 0 0 18px #10b981;
    animation: pulse-green 2s infinite ease-in-out;
}

/* Checking / Waking Up State (Amber / Yellow) */
.server-status-badge.status-checking,
.server-status-badge.status-waking {
    background: rgba(245, 158, 11, 0.14);
    border: 1px solid rgba(245, 158, 11, 0.45);
    color: #f59e0b;
}
.server-status-badge.status-checking .pulse-dot,
.server-status-badge.status-waking .pulse-dot {
    background-color: #f59e0b;
    box-shadow: 0 0 10px #f59e0b, 0 0 18px #f59e0b;
    animation: pulse-amber 1.5s infinite ease-in-out;
}

/* Offline State (Red) */
.server-status-badge.status-offline {
    background: rgba(239, 68, 68, 0.14);
    border: 1px solid rgba(239, 68, 68, 0.45);
    color: #ef4444;
}
.server-status-badge.status-offline .pulse-dot {
    background-color: #ef4444;
    box-shadow: 0 0 10px #ef4444, 0 0 18px #ef4444;
    animation: pulse-red 1.5s infinite ease-in-out;
}

.ping-text {
    font-size: 0.74rem;
    opacity: 0.8;
    margin-left: 2px;
}

/* Pulse Keyframe Animations */
@keyframes pulse-green {
    0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    }
    70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
    }
    100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
    }
}

@keyframes pulse-amber {
    0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
    }
    70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
    }
    100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
    }
}

@keyframes pulse-red {
    0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
    }
    70% {
        transform: scale(1.05);
        box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
    }
    100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
    }
}

/* Password Visibility Toggle Wrapper */
.password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    margin-bottom: 16px;
}
.password-wrapper input {
    width: 100%;
    margin-bottom: 0 !important;
    padding-right: 44px !important;
    box-sizing: border-box;
}
.password-toggle-btn {
    position: absolute;
    right: 12px;
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    cursor: pointer;
    color: var(--text-secondary, #94a3b8);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease, transform 0.2s ease;
    box-shadow: none !important;
    transform: none !important;
    z-index: 2;
    outline: none;
}
.password-toggle-btn:hover {
    color: var(--accent, #3b82f6) !important;
    transform: scale(1.1) !important;
    box-shadow: none !important;
}
.password-toggle-btn svg {
    width: 20px;
    height: 20px;
    pointer-events: none;
}
</style>

<div id="tsparticles"></div>
<div class="theme-switch-wrapper">
    <button id="theme-toggle-btn" title="Toggle Day/Night Mode">🌙</button>
</div>

<script>
// Password Visibility Toggle Function
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const eyeOpen = btn.querySelector('.eye-open');
    const eyeClosed = btn.querySelector('.eye-closed');
    
    if (input.type === 'password') {
        input.type = 'text';
        if (eyeOpen) eyeOpen.style.display = 'none';
        if (eyeClosed) eyeClosed.style.display = 'block';
        btn.setAttribute('title', 'Hide password');
    } else {
        input.type = 'password';
        if (eyeOpen) eyeOpen.style.display = 'block';
        if (eyeClosed) eyeClosed.style.display = 'none';
        btn.setAttribute('title', 'Show password');
    }
}

// Health check engine for the LED Pulse Indicator
async function checkBackendHealth(targetUrl = '/api/health/') {
    const badge = document.getElementById('serverStatusBadge');
    const textEl = document.getElementById('serverStatusText');
    const pingEl = document.getElementById('serverPingTime');
    if (!badge || !textEl) return;

    const startTime = performance.now();
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);
        
        const res = await fetch(targetUrl, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timeoutId);
        const latency = Math.round(performance.now() - startTime);

        if (res.ok) {
            badge.className = 'server-status-badge status-online';
            textEl.textContent = 'Active';
            if (pingEl) pingEl.textContent = `• ${latency}ms`;
        } else {
            badge.className = 'server-status-badge status-waking';
            textEl.textContent = 'Connecting...';
            if (pingEl) pingEl.textContent = '';
        }
    } catch (e) {
        badge.className = 'server-status-badge status-offline';
        textEl.textContent = 'Offline';
        if (pingEl) pingEl.textContent = '';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const body = document.body;
    const toggleBtn = document.getElementById('theme-toggle-btn');
    
    // Check local storage for preference
    const savedTheme = localStorage.getItem('theme') || 'light';
    
    const loadParticles = (theme) => {
        let pColor = theme === 'light' ? "#3b82f6" : "#00ffff";
        let lColor = theme === 'light' ? "#8b5cf6" : "#ff00ff";
        
        tsParticles.load("tsparticles", {
            fpsLimit: 60,
            particles: {
                number: { value: 50, density: { enable: true, value_area: 800 } },
                color: { value: pColor },
                links: { enable: true, color: lColor, distance: 150, opacity: 0.4, width: 1 },
                move: { enable: true, speed: 1.5, direction: "none", random: false, straight: false, outModes: "out" },
                size: { value: { min: 1, max: 3 } },
                opacity: { value: 0.5 }
            },
            interactivity: {
                events: {
                    onHover: { enable: true, mode: "grab" },
                    onClick: { enable: true, mode: "push" }
                },
                modes: {
                    grab: { distance: 180, links: { opacity: 0.8 } },
                    push: { quantity: 4 }
                }
            }
        });
    };

    const applyTheme = (theme) => {
        if (theme === 'light') {
            body.classList.add('light-mode');
            toggleBtn.textContent = '☀️';
        } else {
            body.classList.remove('light-mode');
            toggleBtn.textContent = '🌙';
        }
        localStorage.setItem('theme', theme);
        loadParticles(theme);
    };

    // Initialize
    applyTheme(savedTheme);

    // Toggle logic
    toggleBtn.addEventListener('click', () => {
        const current = body.classList.contains('light-mode') ? 'light' : 'dark';
        applyTheme(current === 'light' ? 'dark' : 'light');
    });

    // Check backend health immediately and every 15s
    checkBackendHealth();
    setInterval(() => checkBackendHealth(), 15000);

    // --- Interactive Node Limiting & Decay Engine ---
    let clickTimes = [];
    const BASE_PARTICLES = 50;

    window.addEventListener('click', (e) => {
        const container = window.tsParticles ? window.tsParticles.domItem(0) : null;
        if (!container) return;
        
        let now = Date.now();
        clickTimes = clickTimes.filter(t => now - t < 1000);
        
        if(e.target.closest('#theme-toggle-btn')) return;

        if (clickTimes.length >= 3) {
            setTimeout(() => {
                if(container.particles && container.particles.count > BASE_PARTICLES) {
                    container.particles.removeQuantity(4);
                }
            }, 10);
        } else {
            clickTimes.push(now);
            setTimeout(() => {
                if(container.particles && container.particles.count > BASE_PARTICLES) {
                    container.particles.removeQuantity(4);
                }
            }, 3500);
        }
    }, true);
    
    // --- Smooth Page Transitions ---
    const links = document.querySelectorAll('a');
    links.forEach(link => {
        link.addEventListener('click', function(e) {
            const isSamePage = this.pathname === window.location.pathname;
            const isHashOnly = isSamePage && this.hash;
            
            if (this.hostname === window.location.hostname && 
                !isHashOnly && 
                this.getAttribute('target') !== '_blank' &&
                !this.hasAttribute('download') &&
                !e.ctrlKey && !e.metaKey && !e.shiftKey) {
                
                e.preventDefault();
                const targetUrl = this.href;
                
                document.body.style.animation = "fadeOut 0.35s ease-out forwards";
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 300);
            }
        });
    });

    // Form Submissions
    const forms = document.querySelectorAll('form');
    forms.forEach(form => {
        form.addEventListener('submit', function(e) {
            if (this.getAttribute('target') !== '_blank') {
                e.preventDefault();
                document.body.style.animation = "fadeOut 0.35s ease-out forwards";
                setTimeout(() => {
                    this.submit();
                }, 300);
            }
        });
    });

    // Fix for browser back button (bfcache)
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            document.body.style.animation = "none";
            void document.body.offsetWidth;
            document.body.style.animation = "fadeIn 0.4s ease-out forwards";
        }
    });

});
</script>
