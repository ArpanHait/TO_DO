<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile - TO_DO</title>
    <link rel="icon" type="image/png" href="favicon.png?v=3">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=3">
    <link rel="apple-touch-icon" href="favicon.png?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script src="app.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --grid-line: rgba(0, 255, 255, 0.08);
            --glow-center: rgba(255, 0, 255, 0.15);
            --container-bg: rgba(15, 23, 42, 0.85);
            --container-border: rgba(255, 255, 255, 0.08);
            --container-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(11, 15, 25, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --btn-grad-start: #2563eb;
            --btn-grad-end: #4f46e5;
        }

        body.light-mode {
            --bg-main: #f0f4f8;
            --grid-line: rgba(0, 0, 0, 0.04);
            --glow-center: rgba(0, 0, 255, 0.05);
            --container-bg: rgba(255, 255, 255, 0.9);
            --container-border: rgba(226, 232, 240, 0.9);
            --container-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.2);
            --btn-grad-start: #2563eb;
            --btn-grad-end: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at center, var(--glow-center), transparent 60%),
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-primary);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Server Health Pulse LED Badge */
        .server-status-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        .server-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 7px 16px;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            transition: all 0.35s ease;
            cursor: default;
            user-select: none;
        }

        .pulse-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .server-status-badge.status-online {
            background: rgba(16, 185, 129, 0.14);
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: #10b981;
        }
        .server-status-badge.status-online .pulse-dot {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981, 0 0 18px #10b981;
            animation: pulse-green 2s infinite ease-in-out;
        }

        .server-status-badge.status-checking,
        .server-status-badge.status-waking {
            background: rgba(245, 158, 11, 0.14);
            border: 1px solid rgba(245, 158, 11, 0.45);
            color: #f59e0b;
        }
        .server-status-badge.status-checking .pulse-dot,
        .server-status-badge.status-waking .pulse-dot {
            background-color: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
            animation: pulse-amber 1.5s infinite ease-in-out;
        }

        .server-status-badge.status-offline {
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.45);
            color: #ef4444;
        }
        .server-status-badge.status-offline .pulse-dot {
            background-color: #ef4444;
            box-shadow: 0 0 10px #ef4444;
            animation: pulse-red 1.5s infinite ease-in-out;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes pulse-amber {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .ping-text {
            font-size: 0.74rem;
            opacity: 0.8;
            margin-left: 2px;
        }

        .update-container {
            background: var(--container-bg);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid var(--container-border);
            box-shadow: var(--container-shadow);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .update-container h2 {
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-top: 0;
            margin-bottom: 24px;
        }

        /* Avatar Container & Live Preview */
        .avatar-preview-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
        }

        .current-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.3s ease;
            display: block;
        }

        .avatar-initial-fallback {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            font-size: 3.2rem;
            font-weight: 800;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .preview-badge {
            position: absolute;
            bottom: -4px;
            right: 4px;
            background: #10b981;
            color: white;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 999px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .update-container form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .file-input-wrapper {
            position: relative;
            text-align: left;
        }

        .file-input-label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .update-container input[type="file"] {
            padding: 12px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            background-color: var(--input-bg);
            color: var(--text-primary);
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
        }

        .update-container input[type="file"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            outline: none;
        }

        /* Animated Upload Progress Bar */
        .upload-progress-wrapper {
            margin: 4px 0;
            text-align: left;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #10b981);
            border-radius: 999px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .upload-status-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 600;
        }

        .update-container button[type="submit"] {
            background: linear-gradient(135deg, var(--btn-grad-start), var(--btn-grad-end));
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .update-container button[type="submit"]:hover:not(:disabled) {
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }

        .update-container button[type="submit"]:disabled {
            opacity: 0.75;
            cursor: not-allowed;
            transform: none;
        }

        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .update-container a.cancel-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 1px solid var(--container-border);
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        .update-container a.cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 0.88rem;
            text-align: center;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        #tsparticles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .theme-switch-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        #theme-toggle-btn {
            background: var(--container-bg);
            border: 1px solid var(--container-border);
            color: var(--text-primary);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: var(--container-shadow);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <div class="theme-switch-wrapper">
        <button id="theme-toggle-btn" title="Toggle Light/Dark Theme">🌙</button>
    </div>

    <!-- Top-Middle Pulse LED Backend Status -->
    <div class="server-status-wrapper">
        <div id="serverStatusBadge" class="server-status-badge status-checking" title="Live status of your backend server & database">
            <span class="pulse-dot"></span>
            <span id="serverStatusText" class="status-text">Connecting to Server...</span>
            <span id="serverPingTime" class="ping-text"></span>
        </div>
    </div>

    <div class="update-container">
        <h2>Update Profile Photo</h2>

        <div id="alertBox"></div>
        
        <!-- Live Avatar Preview Circle -->
        <div class="avatar-preview-wrapper" id="avatarPreviewWrapper">
            <img id="avatarImg" src="" alt="Current Photo" class="current-photo" style="display: none;">
            <div id="avatarFallback" class="avatar-initial-fallback">U</div>
            <span id="newPreviewBadge" class="preview-badge" style="display: none;">New Preview</span>
        </div>
        
        <form id="profileForm">
            <div class="file-input-wrapper">
                <label for="imageInput" class="file-input-label">Select a new image from your device</label>
                <input type="file" id="imageInput" name="image" accept="image/*" title="Choose a new profile photo" aria-label="Choose a new profile photo" required>
            </div>

            <!-- Upload Progress Bar (shown on submit) -->
            <div id="uploadProgressWrapper" class="upload-progress-wrapper" style="display: none;">
                <div class="progress-track">
                    <div id="progressFillBar" class="progress-fill-bar"></div>
                </div>
                <div class="upload-status-text">
                    <span id="uploadStatusLabel">Compressing & Uploading...</span>
                    <span id="uploadPercentLabel">0%</span>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="material-symbols-outlined" style="font-size: 20px;">cloud_upload</span>
                <span>Upload Photo</span>
            </button>
            <a href="dashboard.html" class="cancel-btn">Cancel</a>
        </form>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const avatarImg = document.getElementById('avatarImg');
        const avatarFallback = document.getElementById('avatarFallback');
        const newPreviewBadge = document.getElementById('newPreviewBadge');
        const submitBtn = document.getElementById('submitBtn');
        const progressWrapper = document.getElementById('uploadProgressWrapper');
        const progressFill = document.getElementById('progressFillBar');
        const percentLabel = document.getElementById('uploadPercentLabel');
        const statusLabel = document.getElementById('uploadStatusLabel');

        // Instant Live Preview on image selection
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                avatarImg.src = objectUrl;
                avatarImg.style.display = 'block';
                if (avatarFallback) avatarFallback.style.display = 'none';
                newPreviewBadge.style.display = 'inline-block';
            }
        });

        // Fast Client-Side Image Compression using Canvas
        async function compressImageFile(file, maxDimension = 500, quality = 0.85) {
            return new Promise((resolve) => {
                if (file.size < 250 * 1024) {
                    resolve(file);
                    return;
                }

                const img = new Image();
                img.onload = () => {
                    let width = img.width;
                    let height = img.height;

                    if (width > maxDimension || height > maxDimension) {
                        if (width > height) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        if (!blob) {
                            resolve(file);
                            return;
                        }
                        const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                            type: 'image/jpeg',
                            lastModified: Date.now()
                        });
                        resolve(compressedFile);
                    }, 'image/jpeg', quality);
                };
                img.onerror = () => resolve(file);
                img.src = URL.createObjectURL(file);
            });
        }

        // Initialize User state
        configPromise.then(() => {
            const token = getToken();
            const userObj = getUser();
            if (!token || !userObj) {
                window.location.href = 'login.html';
                return;
            }

            const initial = (userObj.username || 'U')[0].toUpperCase();
            avatarFallback.textContent = initial;

            if (userObj.image_url) {
                avatarImg.src = getAvatarUrl(userObj.image_url);
                avatarImg.style.display = 'block';
                avatarFallback.style.display = 'none';
            } else {
                avatarImg.style.display = 'none';
                avatarFallback.style.display = 'flex';
            }

            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
            }
        });

        // Submit Form with Compression & Progress animation
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.replaceChildren();
            
            const file = imageInput.files[0];
            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-spinner"></span> <span>Uploading Photo...</span>';
            progressWrapper.style.display = 'block';
            progressFill.style.width = '25%';
            percentLabel.textContent = '25%';
            statusLabel.textContent = 'Optimizing photo...';

            await configPromise;

            try {
                const compressedFile = await compressImageFile(file);

                progressFill.style.width = '65%';
                percentLabel.textContent = '65%';
                statusLabel.textContent = 'Uploading to server...';

                const formData = new FormData();
                formData.append('image', compressedFile);

                const res = await fetch(`${API_BASE}/api/profile/update/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${getToken()}`
                    },
                    body: formData
                });

                progressFill.style.width = '95%';
                percentLabel.textContent = '95%';

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to upload image');

                // Update local storage user profile image
                const currentUser = getUser();
                currentUser.image_url = data.user.image_url;
                setUser(currentUser);

                progressFill.style.width = '100%';
                percentLabel.textContent = '100%';
                statusLabel.textContent = 'Complete! Redirecting...';

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 300);
            } catch (err) {
                const alert = document.createElement('div');
                alert.className = 'alert alert-error';
                alert.textContent = err instanceof Error ? err.message : 'Failed to upload image. Please try again.';
                alertBox.replaceChildren(alert);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 20px;">cloud_upload</span> <span>Upload Photo</span>';
                progressWrapper.style.display = 'none';
            }
        });

        // Theme and Particles setup
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const toggleBtn = document.getElementById('theme-toggle-btn');
            const savedTheme = localStorage.getItem('theme') || 'dark';

            const loadParticles = (theme) => {
                let pColor = theme === 'light' ? "#3b82f6" : "#00ffff";
                let lColor = theme === 'light' ? "#8b5cf6" : "#ff00ff";
                
                tsParticles.load("tsparticles", {
                    fpsLimit: 60,
                    particles: {
                        number: { value: 45, density: { enable: true, value_area: 800 } },
                        color: { value: pColor },
                        links: { enable: true, color: lColor, distance: 150, opacity: 0.35, width: 1 },
                        move: { enable: true, speed: 1.2, direction: "none", random: false, straight: false, outModes: "out" },
                        size: { value: { min: 1, max: 2.5 } },
                        opacity: { value: 0.4 }
                    },
                    interactivity: {
                        events: {
                            onHover: { enable: true, mode: "grab" },
                            onClick: { enable: true, mode: "push" }
                        },
                        modes: {
                            grab: { distance: 160, links: { opacity: 0.6 } },
                            push: { quantity: 3 }
                        }
                    }
                });
            };

            const applyTheme = (theme) => {
                if (theme === 'light') {
                    body.classList.add('light-mode');
                    toggleBtn.textContent = '☀️';
                } else {
                    body.classList.remove('light-mode');
                    toggleBtn.textContent = '🌙';
                }
                localStorage.setItem('theme', theme);
                loadParticles(theme);
            };

            applyTheme(savedTheme);

            toggleBtn.addEventListener('click', () => {
                const current = body.classList.contains('light-mode') ? 'light' : 'dark';
                applyTheme(current === 'light' ? 'dark' : 'light');
            });
        });
    </script>
</body>
</html>
